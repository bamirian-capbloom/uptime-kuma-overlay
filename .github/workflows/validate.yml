name: Validate pinned overlay
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overlay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        features: [monitor-dependencies, 'monitor-dependencies,toast-lifecycle']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.0'
      - name: Overlay failure-safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify Docker availability
        run: docker info
      - name: Check baseline MQTT container startup
        run: |
          docker run -d --name overlay-mqtt-preflight hivemq/hivemq-ce:2023.5
          ready=0
          for attempt in $(seq 1 60); do
            if docker logs overlay-mqtt-preflight 2>&1 | grep -q 'Started HiveMQ in'; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' overlay-mqtt-preflight)" != true ]; then
              break
            fi
            sleep 2
          done
          docker logs overlay-mqtt-preflight
          docker rm -f overlay-mqtt-preflight
          test "$ready" = 1
      - name: Replay official pin, install lockfile, test and build
        run: >-
          python3 scripts/validate.py https://github.com/louislam/uptime-kuma.git
          "${RUNNER_TEMP}/kuma-validated" --features '${{ matrix.features }}'
          --full --install-browser
        env:
          CI: 'true'
          HEADLESS_TEST: '1'
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-${{ strategy.job-index }}
          path: ${{ runner.temp }}/kuma-validated/private/playwright-*
          if-no-files-found: ignore
